.topline{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.97);padding:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #eee;min-height:49px}

.controls>div{min-width:0}.controls label,.controls .control-label{min-height:0;font-size:12px;line-height:18px}

.coverage-heading label{cursor:help}

.plotbar{display:flex;align-items:center;flex-wrap:wrap;margin-left:auto;margin-right:auto;padding-left:66px}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px}
.legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.threshold{color:var(--threshold-color);display:inline-flex;align-items:center;gap:4px}.threshold-line{width:20px;height:10px;flex:none}.threshold-line line{stroke:currentColor;stroke-width:1.5;stroke-dasharray:6 4}
#plot{position:relative;min-height:0;touch-action:none;margin:4px auto 0;width:100%}canvas{width:100%;height:100%;display:block}
.tooltip{position:absolute;pointer-events:none;background:#1d1d1f;color:#fff;border-radius:8px;padding:10px 13px;white-space:pre-line;font-size:12px;line-height:1.7;max-width:min(450px,100%);overflow-wrap:anywhere}

.overview-table{width:100%;table-layout:auto;border-collapse:collapse;font-size:12px;line-height:1.6}
.overview-table th,.overview-table td{padding:5px 7px;text-align:right;vertical-align:middle;font-weight:400;white-space:nowrap}

.overview-table thead th,.overview-table thead td{border-bottom:1px solid #e8e8ed;padding-top:0;padding-bottom:4px}
.group-value,.group-value small{font:inherit;color:inherit;white-space:nowrap}.group-value small{margin-left:3px}
.distribution-summary tr:first-child th,.distribution-summary tr:first-child td{border-top:1px solid #e8e8ed;padding-top:8px}
.reviewline{margin:0 0 12px}textarea{height:52px;resize:vertical;font-size:12px}

.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}[hidden]{display:none!important}
@media(max-width:1000px){
 main{padding:0 26px 22px}.overview-table{font-size:10px;letter-spacing:-.1px}.overview-table th,.overview-table td{padding-left:1px;padding-right:1px}.group-value small{margin-left:2px}
}
@media(max-width:720px){

}
@container(max-width:534px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.resetline{max-width:110px}.plotbar{padding-left:0}}

function readReviewPayload(meta){
 const tag=document.createElement("script");
 return new Promise((resolve,reject)=>{
  bulkPending={sample_id:meta.sample_id,resolve};
  tag.src=meta.data_file;
  tag.onerror=()=>reject(new Error(t("loadFailed")+": "+meta.sample_id));
  tag.onload=()=>reject(new Error(t("wrongData")+" "+meta.sample_id));
  document.body.append(tag);
 }).finally(()=>{tag.remove();bulkPending=null;});
}
function decodePayload(meta,payload){
 if(payload.sample_id!==meta.sample_id||payload.fingerprint!==meta.fingerprint)throw new Error(t("wrongData"));
 const rows=payload.rows.map(r=>({id:r[0],length:r[1],coverage:r[2],label:r[3]})),reference=C.reference(rows);
 if(rows.length!==meta.contigs||rows.reduce((n,r)=>n+r.length,0)!==meta.bp||reference.n!==meta.reference.n||reference.median!==meta.reference.cov_10kb)throw new Error(t("wrongStats"));
 return {rows,reference};
}
function markReviewed(s,evaluated){

}
$("markAll").addEventListener("click",async()=>{

  const yT=v=>Math.asinh(v),yI=v=>Math.sinh(v);

    if(holder.style.height!==targetHeight+"px")holder.style.height=targetHeight+"px";
    const h=holder.clientHeight,dpr=window.devicePixelRatio||1;
    if(canvas.width!==Math.round(w*dpr))canvas.width=Math.round(w*dpr);

  // Cache the two point appearances once per sample and axis layout.
  // Threshold movement then clips these layers instead of redrawing every dot.
  function preparePointLayers(g,dpr){
    const key=[g.w,g.h,dpr,g.x.a,g.x.b,g.y.b].join("/");
    if(pointLayers?.key===key)return;
    const layers=availableLabels.map((label,index)=>[.22,.55].map(alpha=>{
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(g.w*dpr);canvas.height=Math.round(g.h*dpr);
      const context=canvas.getContext("2d");context.scale(dpr,dpr);
      context.globalAlpha=alpha;context.fillStyle=labelColor(index);
      return {canvas,context};
    }));
    hoverPoints=rows.map(r=>{
      const x=g.x.f(r.length),y=g.y.f(r.coverage),label=availableLabels.indexOf(r.label);
      for(const layer of layers[label]){
        layer.context.beginPath();layer.context.arc(x,y,2,0,Math.PI*2);layer.context.fill();
      }
      return {x,y,r,label,
        xBin:Math.max(0,Math.min(47,Math.floor((x-g.left)/(g.right-g.left)*48))),
        yBin:Math.max(0,Math.min(47,Math.floor((g.bottom-y)/(g.bottom-g.top)*48)))};
    });
    pointLayers={key,layers};
  }
  function drawPoints(ctx,g,s,lx,cy,uy){
    const left=Math.max(g.left,Math.min(g.right,lx));
    const top=s.maxCoverage===null?g.top:Math.max(g.top,Math.min(g.bottom,uy));
    const bottom=cy===null?g.bottom:Math.max(g.top,Math.min(g.bottom,cy));
    for(let pass=0;pass<2;pass++)for(let label=0;label<availableLabels.length;label++){

      if(pass===1&&!included)continue;

      if(pass===0)ctx.rect(g.left,g.top,g.right-g.left,g.bottom-g.top);
      if(included){
        if(!result)ctx.rect(g.left,g.top,g.right-g.left,g.bottom-g.top);
        else ctx.rect(left,top,g.right-left,Math.max(0,bottom-top));

  function drawDistributions(ctx,g){

  }

translate();
