{% set version = "1.0" %}

package:
  name: eukasmchecker
  version: {{ version }}

source:
  url: https://github.com/WeStrainGroup/EukAsmChecker/releases/download/{{ version }}/eukasmchecker-{{ version }}.tar.gz
  sha256: 8933c06842cb4841517071a33f1b57c7a8a00498521e92a3ad792b92c7d4e1a9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v
  entry_points:
    - eukasmchecker = eukasmchecker.cli:main

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=3.8
    - __unix

test:
  imports:
    - eukasmchecker
    - eukasmchecker.cli
  source_files:
    - tests/test_workflow.py
  commands:
    - eukasmchecker --version
    - eukasmchecker prepare --help
    - eukasmchecker review --help
    - eukasmchecker apply --help
    - python -c "from pathlib import Path; import eukasmchecker; assert (Path(eukasmchecker.__file__).parent / 'review.html').is_file()"
    - python -m unittest discover -s tests -p test_workflow.py -v

about:
  home: https://github.com/WeStrainGroup/EukAsmChecker
  dev_url: https://github.com/WeStrainGroup/EukAsmChecker
  doc_url: https://github.com/WeStrainGroup/EukAsmChecker#command-line-version
  license: CC-BY-NC-SA-4.0
  license_file: LICENSE
  summary: Interactive review and filtering of eukaryotic genome assemblies
  description: |
    Review and filter assemblies by sequence length, reads coverage and
    EukContigMiner labels. Includes the offline interactive review interface.
    Supports Linux and macOS; classification and read mapping are performed separately.

extra:
  recipe-maintainers:
    - WeStrainGroup
